<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="editStagePage" class="edit-stage default-edit default-container default-label default-button hidden">
	<span class="edit-comment">アイテム/クリア状況</span>
	<div class="edit-draw-area">
		<div class="edit-item-scroll default-scroll">
			<ul id="edit-item-list" class="default-scroll-list">
				<li class="edit-item-scroll-list default-label">
					<label for="edit-item-medal">メダル</label>
					<input type="number" id="edit-item-medal" name="number" min="0" max="999999999" step="100">
				</li>
			</ul>
		</div>
		<div class="edit-stage-scroll default-scroll">
			<ul id="edit-stage-list" class="default-scroll-list"></ul>
		</div>
	</div>
	<div class="edit-button-area">
		<button id="edit-stage-save" type="button">セーブ</button>
		<button id="go-to-edit-unit-from-edit-stage" type="button">表示切替</button>
		<button id="go-to-toppage-from-edit-stage" type="button">戻る</button>
	</div>
</div>
</html>
