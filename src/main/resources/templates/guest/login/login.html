<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<title>login</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" th:href="@{/css/guest/login/login.css}">
	<script th:src="@{/js/guest/login/login.js}" type="module"></script>
</head>
<body>
	<div th:if="${message}">
		<p th:text="${message}"></p>
	</div>
	<form th:action="@{/login}" method="post">
		<div>
			<label>ユーザー名:</label>
			<input type="text" name="username">
		</div>
		<div>
			<label>パスワード:</label>
			<input type="password" name="password">
		</div>
		<button type="submit">ログイン</button>
	</form>
</body>
</html>
