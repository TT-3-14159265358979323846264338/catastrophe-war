services:
  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/catastrophe_war_db?allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: catastrophe_war_user
      SPRING_DATASOURCE_PASSWORD: catastrophe_war_pass
      SPRING_SESSION_JDBC_INITIALIZE_SCHEMA: "never"
      SPRING_MAIN_WEB_APPLICATION_TYPE: servlet
      JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
      APP_AUTO_SHUTDOWN_ENABLED: "false"

  db:
    image: mysql:9
    environment:
      MYSQL_DATABASE: catastrophe_war_db
      MYSQL_USER: catastrophe_war_user
      MYSQL_PASSWORD: catastrophe_war_pass
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/1_init.sql:ro

volumes:
  mysql_data: